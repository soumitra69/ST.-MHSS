<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="crest-title">
  <title id="crest-title">St. Michael's Higher Secondary School Umsning Crest</title>
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B365D" />
      <stop offset="100%" stop-color="#0F1E36" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D774" />
      <stop offset="50%" stop-color="#D99B26" />
      <stop offset="100%" stop-color="#B47A1E" />
    </linearGradient>
  </defs>
  <!-- Outer Gold Ring & Navy Seal -->
  <circle cx="128" cy="128" r="122" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="128" cy="128" r="110" fill="none" stroke="#F4E8C1" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7" />
  <circle cx="128" cy="128" r="98" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="3.5" />

  <!-- Inner Shield -->
  <path d="M128 44 L182 64 V120 C182 162 156 192 128 206 C100 192 74 162 74 120 V64 Z" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />

  <!-- Shield Quarter Dividers / Cross of St. Michael -->
  <path d="M128 50 V200 M78 118 H178" stroke="url(#goldGrad)" stroke-width="3" opacity="0.85" />

  <!-- Top Star of Excellence -->
  <polygon points="128,60 133,72 146,72 135,80 139,92 128,84 117,92 121,80 110,72 123,72" fill="url(#goldGrad)" />

  <!-- Open Book of Knowledge -->
  <path d="M98 132 C108 128 118 129 128 135 C138 129 148 128 158 132 V162 C148 158 138 159 128 165 C118 159 108 158 98 162 Z" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M128 135 V165" stroke="#1B365D" stroke-width="2" />

  <!-- Bottom Motto Banner -->
  <path d="M56 204 Q128 224 200 204 L192 224 Q128 242 64 224 Z" fill="url(#goldGrad)" stroke="#0F1E36" stroke-width="1.5" />
  <text x="128" y="221" fill="#0F1E36" font-family="Georgia, serif" font-size="13" font-weight="700" letter-spacing="2.2" text-anchor="middle">EXCELSIOR • 1961</text>
</svg>
